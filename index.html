<h1>Project Tagger</h1>
<p>An Outlook add-in for SP Industries. It adds a panel beside the email you are reading with a project dropdown. Picking a project tags the email with an Outlook category of the same name.</p>
<p>Install by loading <code>manifest.xml</code> from this site as a custom add-in in Outlook.</p>
